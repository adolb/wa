<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Cozy Pastel Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            overscroll-behavior: none;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        /* Latar Belakang Pastel & Floral Soft */
        .cozy-window {
            background: linear-gradient(160deg, #fff6f7 0%, #fce8ec 50%, #f9e1e6 100%);
            border: 1px solid rgba(235, 175, 190, 0.45);
            box-shadow: 0 25px 50px -12px rgba(180, 110, 125, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
        }

        /* Motif Kelopak & Bunga Halus di Latar Chat */
        .floral-bg {
            background-image: 
                radial-gradient(circle at 18% 25%, rgba(255, 192, 203, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 82% 72%, rgba(247, 202, 201, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 245, 240, 0.6) 0%, transparent 70%);
        }

        /* Header & Input Bar Frosted Pastel Glass */
        .cozy-glass-header {
            background: rgba(255, 248, 249, 0.78);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-bottom: 1px solid rgba(230, 175, 188, 0.35);
            padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
        }

        .cozy-glass-footer {
            background: rgba(255, 248, 249, 0.82);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-top: 1px solid rgba(230, 175, 188, 0.35);
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
        }

        .cozy-sidebar-glass {
            background: rgba(255, 244, 246, 0.96);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-right: 1px solid rgba(230, 175, 188, 0.4);
        }

        /* Bubble Chat Kiri (Krem Hangat) & Kanan (Pink Pastel) */
        .bubble-left {
            background: rgba(255, 253, 251, 0.92);
            color: #4a3538;
            border: 1px solid rgba(235, 190, 200, 0.45);
            box-shadow: 0 4px 12px rgba(185, 130, 140, 0.08);
        }

        .bubble-right {
            background: linear-gradient(135deg, #fbd1dc 0%, #f5b7c7 100%);
            color: #4a2e33;
            border: 1px solid rgba(238, 160, 180, 0.55);
            box-shadow: 0 4px 14px rgba(225, 135, 155, 0.22);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(220, 155, 170, 0.45);
            border-radius: 10px;
        }

        #sidebar {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-[#f7dce2] via-[#fdf2f4] to-[#f4ced7] h-[100dvh] w-full flex justify-center items-center p-0 sm:p-4">

    <div id="app" class="w-full h-[100dvh] sm:h-[92vh] sm:max-w-md sm:rounded-3xl flex flex-col overflow-hidden relative cozy-window transition-all duration-300">
        
        <!-- ALERT TOAST -->
        <div id="toast-modal" class="hidden absolute top-16 left-1/2 -translate-x-1/2 z-50 bg-[#5a3b40] text-[#fff6f8] text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg backdrop-blur-xl transition-all text-center max-w-[85%]">
            <span id="toast-message"></span>
        </div>

        <!-- HALAMAN LOGIN PASSCODE PASTEL -->
        <div id="password-section" class="absolute inset-0 cozy-sidebar-glass z-50 p-6 flex flex-col justify-center items-center space-y-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-[#f7b2c4] to-[#f296ae] rounded-2xl flex items-center justify-center text-white text-3xl shadow-md border border-white/60 mb-1">🌸</div>
            <div class="text-center space-y-1">
                <h2 class="text-lg font-bold text-[#4a3236] tracking-tight">Masukkan Passcode</h2>
                <p class="text-xs text-[#8c666d] font-medium">Masukkan 4 digit sandi untuk masuk</p>
            </div>

            <!-- Indikator Titik Passcode -->
            <div class="flex space-x-4 my-2">
                <div id="dot-1" class="w-3.5 h-3.5 rounded-full border border-[#d69aa6] transition-all duration-200"></div>
                <div id="dot-2" class="w-3.5 h-3.5 rounded-full border border-[#d69aa6] transition-all duration-200"></div>
                <div id="dot-3" class="w-3.5 h-3.5 rounded-full border border-[#d69aa6] transition-all duration-200"></div>
                <div id="dot-4" class="w-3.5 h-3.5 rounded-full border border-[#d69aa6] transition-all duration-200"></div>
            </div>

            <p id="password-error" class="text-[#d94e67] text-xs text-center font-semibold h-4"></p>

            <!-- Keypad Angka Pastel -->
            <div class="grid grid-cols-3 gap-4 max-w-[260px] w-full">
                <button onclick="pressKey('1')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">1</button>
                <button onclick="pressKey('2')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">2</button>
                <button onclick="pressKey('3')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">3</button>
                <button onclick="pressKey('4')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">4</button>
                <button onclick="pressKey('5')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">5</button>
                <button onclick="pressKey('6')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">6</button>
                <button onclick="pressKey('7')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">7</button>
                <button onclick="pressKey('8')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">8</button>
                <button onclick="pressKey('9')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">9</button>
                <div></div>
                <button onclick="pressKey('0')" class="h-16 w-16 mx-auto rounded-full bg-white/80 hover:bg-[#fce3e8] active:bg-[#f7c8d3] text-[#4a3236] border border-[#ecc4cd] text-2xl font-semibold flex items-center justify-center transition select-none shadow-xs">0</button>
                <button onclick="deleteKey()" class="h-16 w-16 mx-auto rounded-full flex items-center justify-center text-[#8c666d] hover:text-[#4a3236] active:scale-95 transition select-none text-xl font-bold">⌫</button>
            </div>
        </div>

        <!-- SIDEBAR DRAWER -->
        <div id="sidebar" class="absolute inset-y-0 left-0 w-72 cozy-sidebar-glass z-40 transform -translate-x-full flex flex-col shadow-xl">
            <div class="p-5 border-b border-[#ecc4cd]/50 flex justify-between items-center" style="padding-top: calc(1.25rem + env(safe-area-inset-top, 0px));">
                <div class="flex items-center space-x-2">
                    <span class="text-base">🌸</span>
                    <span class="text-xs font-bold text-[#6e4a50]">Menu Ruang</span>
                </div>
                <button onclick="toggleSidebar()" class="text-[#8c666d] font-bold text-sm hover:opacity-75 p-1">✕</button>
            </div>
            
            <div class="flex-1 p-4 space-y-2.5 overflow-y-auto">
                <!-- Menu Galeri Kenangan -->
                <button onclick="openGallery()" class="w-full flex items-center space-x-3 p-3.5 rounded-2xl bg-white/80 hover:bg-[#fce3e8] text-[#4a3236] text-sm font-semibold shadow-xs transition border border-[#ecc4cd]/60">
                    <span class="text-xl">🌷</span>
                    <span class="font-semibold">Galeri Kenangan</span>
                </button>

                <!-- Menu Arsip Harian (Folder Per Hari) -->
                <button onclick="openArchiveMenu()" class="w-full flex items-center space-x-3 p-3.5 rounded-2xl bg-white/80 hover:bg-[#fce3e8] text-[#4a3236] text-sm font-semibold shadow-xs transition border border-[#ecc4cd]/60">
                    <span class="text-xl">📖</span>
                    <span class="font-semibold">Arsip Harian</span>
                </button>
            </div>

            <div class="p-4 border-t border-[#ecc4cd]/50">
                <button onclick="logout()" class="w-full bg-[#fae1e6] hover:bg-[#f5ccd4] text-[#b83b52] p-3.5 rounded-2xl font-bold text-sm transition border border-[#ebaeb9]">Keluar</button>
            </div>
        </div>
        <div id="sidebar-overlay" class="absolute inset-0 bg-[#4a2e33]/25 z-30 hidden backdrop-blur-xs transition-opacity" onclick="toggleSidebar()"></div>

        <!-- HEADER COZY PASTEL -->
        <div class="cozy-glass-header px-4 pb-3 flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="w-8 h-8 flex items-center justify-center text-[#6e4a50] hover:bg-[#f7dce2]/60 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="w-9 h-9 bg-gradient-to-tr from-[#f7b2c4] to-[#f296ae] rounded-full flex items-center justify-center text-white font-bold text-sm shadow-xs border border-white">🌸</div>
                <div>
                    <h1 id="header-title" class="font-bold text-sm text-[#4a3236] tracking-tight">Chat</h1>
                    <span class="text-[10px] text-[#7ca882] font-semibold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#7ca882] animate-pulse"></span> Hari Ini (Mulai 00:00) ♥
                    </span>
                </div>
            </div>
            <button onclick="logout()" class="text-xs bg-white/80 hover:bg-[#fce3e8] border border-[#ecc4cd] px-3.5 py-1.5 rounded-full text-[#6e4a50] font-bold active:scale-95 transition shadow-2xs">Keluar</button>
        </div>

        <!-- DEKORASI BUNGA HALUS DI BACKGROUND -->
        <div class="pointer-events-none absolute inset-0 overflow-hidden z-0 opacity-35">
            <div class="absolute top-20 right-4 text-4xl rotate-12 select-none">🌸</div>
            <div class="absolute bottom-28 left-4 text-4xl -rotate-12 select-none">🌷</div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-7xl opacity-30 select-none">🎀</div>
        </div>

        <!-- KOTAK PESAN (HANYA MENAMPILKAN CHAT HARI INI MULAI JAM 00:00) -->
        <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 floral-bg relative z-1">
        </div>

        <!-- GALERI MODAL -->
        <div id="gallery-modal" class="absolute inset-0 cozy-sidebar-glass z-50 hidden flex flex-col">
            <div class="cozy-glass-header px-4 pb-3 flex justify-between items-center shrink-0">
                <h2 class="font-bold text-[#4a3236] text-sm">Galeri Foto 🌸</h2>
                <button onclick="closeGallery()" class="text-xs bg-[#f5b7c7] text-[#4a2e33] px-3 py-1.5 rounded-full font-bold">Tutup</button>
            </div>
            <div id="gallery-grid" class="flex-1 p-2 grid grid-cols-3 gap-2 overflow-y-auto content-start">
            </div>
        </div>

        <!-- MODAL ARSIP HARIAN (FOLDER PER HARI) -->
        <div id="archive-modal" class="absolute inset-0 cozy-sidebar-glass z-50 hidden flex flex-col">
            <div class="cozy-glass-header px-4 pb-3 flex justify-between items-center shrink-0">
                <h2 id="archive-modal-title" class="font-bold text-[#4a3236] text-sm truncate pr-2">Arsip Harian 📖</h2>
                <button onclick="closeArchiveModal()" class="text-xs bg-[#f5b7c7] text-[#4a2e33] px-3 py-1.5 rounded-full font-bold shrink-0">Tutup</button>
            </div>
            <div id="archive-content" class="flex-1 p-3 overflow-y-auto space-y-2.5 floral-bg">
            </div>
        </div>

        <!-- MODAL GAMBAR BESAR -->
        <div id="image-modal" class="fixed inset-0 bg-[#3a2428]/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeImageModal()">
            <img id="modal-img" class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain border-2 border-white/60">
        </div>

        <!-- PANEL REPLY PREVIEW -->
        <div id="reply-preview-container" class="hidden px-4 py-2 bg-[#fff5f7]/95 border-t border-[#ecc4cd] flex justify-between items-center text-xs z-10 shrink-0 backdrop-blur-md">
            <div class="flex flex-col border-l-3 border-[#ea8ca3] pl-2.5 overflow-hidden">
                <span id="reply-preview-sender" class="font-bold text-[#c95b76]"></span>
                <span id="reply-preview-text" class="text-[#6e4a50] truncate font-medium"></span>
            </div>
            <button onclick="cancelReply()" class="text-[#8c666d] hover:text-[#4a3236] font-bold px-2 text-sm">✕</button>
        </div>

        <!-- INDIKATOR MEREKAM VOICE NOTE -->
        <div id="recording-indicator" class="hidden px-4 py-2.5 bg-[#fce8ec]/95 border-t border-[#e87a96] justify-between items-center z-10 shrink-0 backdrop-blur-md">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#d94e67] animate-ping"></span>
                <span class="text-xs font-bold text-[#b83b52]">Merekam Suara...</span>
                <span id="recording-timer" class="text-xs font-mono font-bold text-[#4a3236] bg-white/80 px-2 py-0.5 rounded-md border border-[#ecc4cd]">00:00</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="cancelRecording()" class="text-xs text-[#8c666d] hover:text-[#4a3236] font-bold px-2.5 py-1 rounded-full bg-white/70 border border-[#ecc4cd]">Batal</button>
                <button onclick="stopAndSendRecording()" class="text-xs bg-gradient-to-tr from-[#f296ae] to-[#e87a96] text-white px-3.5 py-1 rounded-full font-bold shadow-xs">Kirim VN</button>
            </div>
        </div>

        <!-- PANEL INPUT CHATBOX -->
        <div id="chat-input-bar" class="cozy-glass-footer px-3 pt-3 flex items-center space-x-1.5 z-10 shrink-0">
            <!-- Tombol Pilih Gambar -->
            <label class="cursor-pointer text-[#a3767f] hover:text-[#d96b86] p-2 transition shrink-0" title="Kirim Gambar">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <input type="file" id="image-input" accept="image/png, image/jpeg, image/webp, image/gif" class="hidden" onchange="handleImageSelect(event)">
            </label>

            <!-- Tombol Mikrofon Voice Note -->
            <button id="mic-btn" onclick="toggleVoiceRecording()" class="text-[#a3767f] hover:text-[#d96b86] p-2 transition shrink-0" title="Rekam Voice Note">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </button>

            <!-- Input Teks -->
            <input type="text" id="message-input" placeholder="Tulis pesan manis..." class="flex-1 min-w-0 bg-white/90 text-[#4a3236] placeholder-[#b08b92] border border-[#ecc4cd] px-3.5 py-2.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#f296ae] shadow-2xs text-sm" onkeypress="handleMessageKey(event)">
            
            <!-- Tombol Kirim -->
            <button onclick="sendMessage()" class="bg-gradient-to-tr from-[#f296ae] to-[#e87a96] hover:opacity-95 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-sm transition active:scale-95 shrink-0">
                <svg viewBox="0 0 24 24" width="16" height="16" class="fill-current"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://awlxjzfadktcthbumxle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LnE9IH5KKDzdV-gj9tIb6w_uOGVZi4o';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const FIXED_ROOM_ID = "00000000-0000-0000-0000-000000000001";
        let currentSender = "";
        let messageSubscription = null;
        let inactivityTimer = null;
        let absoluteSessionTimer = null;
        let activeReplyTo = null;
        let enteredPasscode = "";
        let renderedMessageIds = new Set();

        // Variabel Voice Note
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingInterval = null;
        let recordingSeconds = 0;
        let isRecording = false;

        function playIMessageSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                console.log("Audio dibatasi browser:", e);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-modal');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3200);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                if (sessionStorage.getItem("chat_auth") === "true" && !isRecording) {
                    showToast("Sesi berakhir (1 menit inaktif).");
                    setTimeout(logout, 1200);
                }
            }, 60 * 1000);
        }

        function startAbsoluteSessionTimer() {
            clearTimeout(absoluteSessionTimer);
            absoluteSessionTimer = setTimeout(() => {
                if (sessionStorage.getItem("chat_auth") === "true") {
                    showToast("Batas waktu 5 menit habis.");
                    setTimeout(logout, 1200);
                }
            }, 5 * 60 * 1000);
        }

        ['mousemove', 'keydown', 'touchstart', 'click'].forEach(evt => {
            window.addEventListener(evt, resetInactivityTimer);
        });

        window.onload = function() {
            if (sessionStorage.getItem("chat_auth") === "true") {
                currentSender = (sessionStorage.getItem("chat_sender") || "").toLowerCase().trim();
                openChatApp();
            } else {
                sessionStorage.clear();
            }
        };

        // OTOMATIS RECONNECT & REFRESH KETIKA LAYAR DIHIDUPKAN KEMBALI
        document.addEventListener("visibilitychange", async function() {
            if (document.visibilityState === 'visible') {
                if (sessionStorage.getItem("chat_auth") === "true") {
                    currentSender = (sessionStorage.getItem("chat_sender") || "").toLowerCase().trim();
                    await loadTodayMessages();
                    subscribeToRealtime();
                    scrollToBottom();
                }
            }
        });

        function pressKey(digit) {
            if (enteredPasscode.length < 4) {
                enteredPasscode += digit;
                updatePasscodeDots();
                if (enteredPasscode.length === 4) {
                    setTimeout(verifyPasscode, 150);
                }
            }
        }

        function deleteKey() {
            if (enteredPasscode.length > 0) {
                enteredPasscode = enteredPasscode.slice(0, -1);
                updatePasscodeDots();
                document.getElementById('password-error').innerText = "";
            }
        }

        function updatePasscodeDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i <= enteredPasscode.length) {
                    dot.classList.add('bg-[#e87a96]', 'border-[#e87a96]');
                    dot.classList.remove('border-[#d69aa6]');
                } else {
                    dot.classList.remove('bg-[#e87a96]', 'border-[#e87a96]');
                    dot.classList.add('border-[#d69aa6]');
                }
            }
        }

        function verifyPasscode() {
            if (enteredPasscode === "4646") {
                currentSender = "wildanganteng";
            } else if (enteredPasscode === "6464") {
                currentSender = "alifasayang";
            } else {
                document.getElementById('password-error').innerText = "Passcode salah!";
                setTimeout(() => {
                    enteredPasscode = "";
                    updatePasscodeDots();
                }, 400);
                return;
            }
            sessionStorage.setItem("chat_auth", "true");
            sessionStorage.setItem("chat_sender", currentSender);
            openChatApp();
        }

        function logout() {
            if (isRecording) cancelRecording();
            sessionStorage.removeItem("chat_auth");
            sessionStorage.removeItem("chat_sender");
            sessionStorage.clear();
            location.reload();
        }

        async function openChatApp() {
            document.getElementById('password-section').classList.add('hidden');
            document.getElementById('header-title').innerText = `${currentSender} ♥`;
            await ensureRoomExists();
            await loadTodayMessages();
            subscribeToRealtime();
            resetInactivityTimer();
            startAbsoluteSessionTimer();
        }

        async function ensureRoomExists() {
            try {
                let { data } = await supabaseClient.from('conversations').select('id').eq('id', FIXED_ROOM_ID).single();
                if (!data) {
                    await supabaseClient.from('conversations').insert({ id: FIXED_ROOM_ID, user1: 'alifasayang', user2: 'wildanganteng' });
                }
            } catch (e) {
                console.warn("Cek room:", e);
            }
        }

        // Helper mendapatkan batas awal hari ini (Jam 00:00:00 waktu lokal) dalam ISO String
        function getStartOfTodayISO() {
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
            return startOfDay.toISOString();
        }

        // Memuat hanya pesan HARI INI (dimulai dari jam 00:00)
        async function loadTodayMessages() {
            const startOfToday = getStartOfTodayISO();

            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('conversation_id', FIXED_ROOM_ID)
                .gte('created_at', startOfToday)
                .order('created_at', { ascending: true });

            if (error) {
                console.error("Gagal mengambil pesan hari ini:", error);
                showToast("Gagal memuat pesan: " + error.message);
                return;
            }

            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            renderedMessageIds.clear();

            // Penanda awal hari di chat utama
            const todayLabel = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            const dayBanner = document.createElement('div');
            dayBanner.className = 'flex justify-center my-2';
            dayBanner.innerHTML = `<span class="text-[10px] bg-white/80 text-[#8c666d] border border-[#ecc4cd] px-3 py-1 rounded-full font-semibold shadow-2xs">🌸 ${todayLabel} • Mulai 00:00</span>`;
            container.appendChild(dayBanner);

            if (!data || data.length === 0) {
                const emptyNote = document.createElement('p');
                emptyNote.id = 'empty-today-note';
                emptyNote.className = 'text-center text-xs text-[#9c767d] mt-8 font-medium';
                emptyNote.innerText = 'Belum ada obrolan hari ini. Mulai sapa sekarang! ✨';
                container.appendChild(emptyNote);
                return;
            }
            
            for (const msg of data) {
                try {
                    if (msg.content || msg.image_path || msg.audio_path) {
                        await appendMessageToUI(msg, container);
                    }
                } catch (err) {
                    console.error("Error rendering pesan ID:", msg.id, err);
                }
            }
            
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTop = container.scrollHeight;
        }

        // ================= KIRIM GAMBAR =================
        async function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            showToast("Mengunggah foto...");
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const imagePath = `${FIXED_ROOM_ID}/${currentSender}/${fileName}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('chat-images')
                .upload(imagePath, file);

            if (uploadError) {
                showToast('Gagal mengunggah gambar: ' + uploadError.message);
                e.target.value = '';
                return;
            }

            const { data, error } = await supabaseClient.from('messages').insert({
                conversation_id: FIXED_ROOM_ID,
                sender_name: currentSender,
                image_path: imagePath,
                reply_to_id: activeReplyTo ? activeReplyTo.id : null,
                reply_to_text: activeReplyTo ? (activeReplyTo.content || '[Media]') : null,
                reply_to_sender: activeReplyTo ? activeReplyTo.sender_name : null
            }).select();

            if (error) {
                showToast('Gagal mengirim foto: ' + error.message);
            } else if (data && data.length > 0) {
                const emptyNote = document.getElementById('empty-today-note');
                if (emptyNote) emptyNote.remove();
                await appendMessageToUI(data[0], document.getElementById('messages-container'));
                scrollToBottom();
            }

            cancelReply();
            e.target.value = '';
        }

        // ================= VOICE NOTE (ANDROID & IOS COMPATIBLE) =================
        async function toggleVoiceRecording() {
            if (!isRecording) {
                await startRecording();
            } else {
                stopAndSendRecording();
            }
        }

        async function startRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast("Browser tidak mendukung rekaman suara atau pastikan menggunakan HTTPS.");
                return;
            }

            audioChunks = [];
            recordingSeconds = 0;
            document.getElementById('recording-timer').innerText = "00:00";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Deteksi format optimal lintas platform (iPhone Safari vs Android Chrome)
                let mimeType = '';
                if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    mimeType = 'audio/mp4'; // iOS Safari
                } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    mimeType = 'audio/webm;codecs=opus'; // Android Chrome / Desktop
                } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                    mimeType = 'audio/webm';
                }

                mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                const actualMimeType = mediaRecorder.mimeType || mimeType || 'audio/webm';

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(track => track.stop());
                    const audioBlob = new Blob(audioChunks, { type: actualMimeType });
                    if (audioBlob.size > 0) {
                        await uploadAndSendAudio(audioBlob, actualMimeType);
                    }
                };

                mediaRecorder.start();
                isRecording = true;

                // Tampilkan UI perekaman
                document.getElementById('mic-btn').classList.add('text-[#d94e67]', 'animate-pulse');
                document.getElementById('recording-indicator').classList.remove('hidden');
                document.getElementById('recording-indicator').classList.add('flex');

                recordingInterval = setInterval(() => {
                    recordingSeconds++;
                    const mins = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
                    const secs = (recordingSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('recording-timer').innerText = `${mins}:${secs}`;

                    // Maksimal rekaman 2 menit
                    if (recordingSeconds >= 120) {
                        stopAndSendRecording();
                    }
                }, 1000);

            } catch (err) {
                console.error("Mic error:", err);
                showToast("Izin mikrofon ditolak atau perangkat tidak mendukung.");
            }
        }

        function cancelRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.onstop = () => {
                    if (mediaRecorder.stream) {
                        mediaRecorder.stream.getTracks().forEach(t => t.stop());
                    }
                };
                mediaRecorder.stop();
            }
            resetRecordingUI();
        }

        function stopAndSendRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                resetRecordingUI();
            }
        }

        function resetRecordingUI() {
            isRecording = false;
            clearInterval(recordingInterval);
            document.getElementById('mic-btn').classList.remove('text-[#d94e67]', 'animate-pulse');
            document.getElementById('recording-indicator').classList.remove('flex');
            document.getElementById('recording-indicator').classList.add('hidden');
        }

        async function uploadAndSendAudio(audioBlob, mimeType) {
            showToast("Mengirim voice note...");

            const fileExt = mimeType.includes('mp4') ? 'm4a' : 'webm';
            const fileName = `vn_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
            const audioPath = `${FIXED_ROOM_ID}/${currentSender}/${fileName}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('chat-audios')
                .upload(audioPath, audioBlob, {
                    contentType: mimeType,
                    upsert: false
                });

            if (uploadError) {
                showToast("Gagal upload VN: " + uploadError.message);
                return;
            }

            const { data: publicUrlData } = supabaseClient.storage
                .from('chat-audios')
                .getPublicUrl(audioPath);

            const publicUrl = publicUrlData.publicUrl;

            const { data, error } = await supabaseClient
                .from('messages')
                .insert({
                    conversation_id: FIXED_ROOM_ID,
                    sender_name: currentSender,
                    content: "[Voice Note]",
                    audio_path: publicUrl,
                    reply_to_id: activeReplyTo ? activeReplyTo.id : null,
                    reply_to_text: activeReplyTo ? (activeReplyTo.content || '[Media]') : null,
                    reply_to_sender: activeReplyTo ? activeReplyTo.sender_name : null
                })
                .select();

            if (error) {
                showToast("Gagal menyimpan VN: " + error.message);
            } else {
                cancelReply();
                if (data && data.length > 0) {
                    const emptyNote = document.getElementById('empty-today-note');
                    if (emptyNote) emptyNote.remove();
                    await appendMessageToUI(data[0], document.getElementById('messages-container'));
                    scrollToBottom();
                }
            }
        }

        // ================= KIRIM PESAN TEKS =================
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();

            if (!content) return;

            const { data, error } = await supabaseClient
                .from('messages')
                .insert({
                    conversation_id: FIXED_ROOM_ID,
                    sender_name: currentSender, 
                    content: content,
                    reply_to_id: activeReplyTo ? activeReplyTo.id : null,
                    reply_to_text: activeReplyTo ? (activeReplyTo.content || '[Media]') : null,
                    reply_to_sender: activeReplyTo ? activeReplyTo.sender_name : null
                })
                .select();

            if (error) {
                showToast('Gagal mengirim: ' + error.message);
            } else {
                input.value = '';
                cancelReply();

                if (data && data.length > 0) {
                    const emptyNote = document.getElementById('empty-today-note');
                    if (emptyNote) emptyNote.remove();
                    await appendMessageToUI(data[0], document.getElementById('messages-container'));
                    scrollToBottom();
                }
            }
        }

        function setReply(id, sender, text) {
            activeReplyTo = { id, sender_name: sender, content: text };
            document.getElementById('reply-preview-sender').innerText = sender;
            document.getElementById('reply-preview-text').innerText = text;
            document.getElementById('reply-preview-container').classList.remove('hidden');
            document.getElementById('message-input').focus();
        }

        function cancelReply() {
            activeReplyTo = null;
            document.getElementById('reply-preview-container').classList.add('hidden');
        }

        function subscribeToRealtime() {
            if (messageSubscription) supabaseClient.removeChannel(messageSubscription);

            messageSubscription = supabaseClient
                .channel('public:messages-realtime')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `conversation_id=eq.${FIXED_ROOM_ID}`
                }, async payload => {
                    const newMsg = payload.new;
                    const sender = (newMsg.sender_name || "").toLowerCase().trim();
                    
                    // Pastikan pesan berasal dari hari ini (mulai 00:00)
                    const isToday = new Date(newMsg.created_at) >= new Date(getStartOfTodayISO());

                    if (sender !== currentSender.toLowerCase().trim() && isToday) {
                        try {
                            const emptyNote = document.getElementById('empty-today-note');
                            if (emptyNote) emptyNote.remove();
                            playIMessageSound();
                            await appendMessageToUI(newMsg, document.getElementById('messages-container'));
                            scrollToBottom();
                        } catch (err) {
                            console.error("Error realtime message render:", err);
                        }
                    }
                })
                .subscribe();
        }

        // Render Bubble Pesan (Bisa dipakai di Chat Utama maupun Arsip Harian)
        async function appendMessageToUI(msg, targetContainer, isArchiveMode = false) {
            if (!isArchiveMode && msg.id && renderedMessageIds.has(msg.id)) {
                return;
            }
            if (!isArchiveMode && msg.id) {
                renderedMessageIds.add(msg.id);
            }

            const msgSender = (msg.sender_name || "").toLowerCase().trim();
            const isLeft = (msgSender !== currentSender.toLowerCase().trim());

            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full mb-1.5 group relative ${isLeft ? 'justify-start' : 'justify-end'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[82%] px-3.5 py-2.5 rounded-2xl text-sm relative ${
                isLeft 
                  ? 'bubble-left rounded-tl-xs' 
                  : 'bubble-right rounded-tr-xs'
            }`;

            let replyHtml = '';
            if (msg.reply_to_text) {
                replyHtml = `
                    <div class="${isLeft ? 'bg-[#fce8ec] border-[#e87a96]' : 'bg-white/45 border-[#c95b76]'} border-l-3 p-1.5 mb-1.5 rounded-lg text-xs">
                        <span class="font-bold text-[#b84864] block">${escapeHtml(msg.reply_to_sender || '')}</span>
                        <span class="text-[#5c3d42] truncate block font-medium">${escapeHtml(msg.reply_to_text)}</span>
                    </div>
                `;
            }

            let imageHtml = '';
            if (msg.image_path) {
                try {
                    const { data } = await supabaseClient.storage.from('chat-images').createSignedUrl(msg.image_path, 3600);
                    if (data && data.signedUrl) {
                        imageHtml = `<img src="${data.signedUrl}" class="rounded-xl mb-1.5 max-h-60 object-cover shadow-xs cursor-pointer hover:opacity-95 transition border border-white/50" onclick="openImageModal('${data.signedUrl}')">`;
                    }
                } catch(e) {
                    console.error("Gagal muat URL foto:", e);
                }
            }

            let audioHtml = '';
            if (msg.audio_path) {
                audioHtml = `
                    <div class="mb-1.5 min-w-[210px] max-w-full">
                        <audio controls preload="metadata" class="w-full h-9 rounded-xl">
                            <source src="${msg.audio_path}" type="audio/mp4">
                            <source src="${msg.audio_path}" type="audio/webm">
                            Browser tidak mendukung audio.
                        </audio>
                    </div>
                `;
            }

            const timeStr = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const showText = msg.content && msg.content !== "[Voice Note]";

            bubble.innerHTML = `
                ${replyHtml}
                ${imageHtml}
                ${audioHtml}
                ${showText ? `<p class="break-words ${!isArchiveMode ? 'pr-6' : ''} leading-relaxed font-normal">${escapeHtml(msg.content)}</p>` : ''}
                <span class="text-[9px] text-[#8c666d] float-right ml-2 mt-1 select-none font-medium">${timeStr} ${!isLeft ? '♥' : ''}</span>
            `;

            if (!isArchiveMode) {
                const menuBtn = document.createElement('button');
                menuBtn.className = `absolute top-1.5 right-1.5 opacity-60 sm:opacity-0 group-hover:opacity-100 bg-white/70 text-[#6e4a50] hover:scale-110 rounded-full p-1 transition shadow-2xs`;
                menuBtn.title = "Balas pesan";
                menuBtn.innerHTML = `<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>`;
                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    const previewLabel = msg.audio_path ? '[Voice Note]' : (msg.image_path ? '[Foto]' : msg.content);
                    setReply(msg.id, msg.sender_name, previewLabel);
                };
                bubble.appendChild(menuBtn);
            }

            wrapper.appendChild(bubble);
            targetContainer.appendChild(wrapper);
        }

        // ================= GALERI FOTO =================
        async function openGallery() {
            toggleSidebar();
            const modal = document.getElementById('gallery-modal');
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '<p class="col-span-3 text-center text-xs text-[#8c666d] mt-10 font-bold">Memuat galeri...</p>';
            modal.classList.remove('hidden');

            const { data } = await supabaseClient
                .from('messages')
                .select('image_path, created_at')
                .eq('conversation_id', FIXED_ROOM_ID)
                .not('image_path', 'is', null)
                .order('created_at', { ascending: false });

            grid.innerHTML = '';
            if (!data || data.length === 0) {
                grid.innerHTML = '<p class="col-span-3 text-center text-xs text-[#8c666d] mt-10 font-bold">Belum ada foto yang dibagikan.</p>';
                return;
            }

            for (const item of data) {
                try {
                    const { data: urlData } = await supabaseClient.storage.from('chat-images').createSignedUrl(item.image_path, 3600);
                    if (urlData && urlData.signedUrl) {
                        const imgBox = document.createElement('div');
                        imgBox.className = 'aspect-square overflow-hidden cursor-pointer bg-white/70 rounded-xl shadow-2xs border border-[#ecc4cd]';
                        imgBox.innerHTML = `<img src="${urlData.signedUrl}" class="w-full h-full object-cover hover:scale-105 transition duration-300" onclick="openImageModal('${urlData.signedUrl}')">`;
                        grid.appendChild(imgBox);
                    }
                } catch(e) {
                    console.error("Gagal render item galeri:", e);
                }
            }
        }

        function closeGallery() {
            document.getElementById('gallery-modal').classList.add('hidden');
        }

        // ================= ARSIP HARIAN (FOLDER PER HARI MULAI 00:00) =================
        async function openArchiveMenu(fromSidebar = true) {
            if (fromSidebar) toggleSidebar();
            const modal = document.getElementById('archive-modal');
            const content = document.getElementById('archive-content');
            document.getElementById('archive-modal-title').innerText = "Arsip Harian 📖";
            
            content.innerHTML = '<p class="text-center text-xs text-[#8c666d] mt-10 font-bold">Memuat arsip per hari...</p>';
            modal.classList.remove('hidden');

            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('conversation_id', FIXED_ROOM_ID)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                content.innerHTML = '<p class="text-center text-xs text-[#8c666d] mt-10 font-bold">Belum ada riwayat chat untuk diarsip.</p>';
                return;
            }

            // Kelompokkan pesan per tanggal lokal (00:00 - 23:59)
            const groupedByDate = {};
            data.forEach(msg => {
                const dateObj = new Date(msg.created_at);
                // Kunci pengelompokan YYYY-MM-DD agar akurat per hari
                const rawDateKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                const displayDate = dateObj.toLocaleDateString('id-ID', {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                
                if (!groupedByDate[rawDateKey]) {
                    groupedByDate[rawDateKey] = {
                        title: displayDate,
                        messages: []
                    };
                }
                groupedByDate[rawDateKey].messages.push(msg);
            });

            content.innerHTML = '';
            const todayRawKey = (() => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            })();
            
            for (const [rawKey, group] of Object.entries(groupedByDate)) {
                const isTodayFolder = (rawKey === todayRawKey);
                const folderBtn = document.createElement('div');
                folderBtn.className = 'bg-white/85 border border-[#ecc4cd] p-3.5 rounded-2xl shadow-2xs cursor-pointer hover:bg-[#fce3e8] transition flex justify-between items-center';
                folderBtn.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="text-2xl shrink-0">${isTodayFolder ? '📂' : '📁'}</span>
                        <div class="truncate">
                            <div class="flex items-center space-x-1.5">
                                <h3 class="font-bold text-[#4a3236] text-xs sm:text-sm truncate">${group.title}</h3>
                                ${isTodayFolder ? '<span class="text-[9px] bg-[#f5b7c7] text-[#4a2e33] px-1.5 py-0.5 rounded-full font-bold shrink-0">Hari Ini</span>' : ''}
                            </div>
                            <p class="text-[10px] text-[#8c666d] font-medium">${group.messages.length} pesan • Mulai 00:00</p>
                        </div>
                    </div>
                    <span class="text-xs text-[#b83b52] font-bold shrink-0 ml-2">Buka →</span>
                `;
                
                folderBtn.onclick = () => showDailyArchiveMessages(group.title, group.messages);
                content.appendChild(folderBtn);
            }
        }

        async function showDailyArchiveMessages(dateTitle, messages) {
            document.getElementById('archive-modal-title').innerText = dateTitle;
            const content = document.getElementById('archive-content');
            content.innerHTML = '';

            // Tombol kembali ke daftar folder
            const backBtn = document.createElement('button');
            backBtn.className = 'w-full mb-2 py-2.5 bg-white/90 hover:bg-[#fce3e8] border border-[#ecc4cd] text-[#4a3236] rounded-xl font-bold text-xs shadow-2xs transition sticky top-0 z-10 backdrop-blur-md';
            backBtn.innerText = '← Kembali ke Daftar Folder Tanggal';
            backBtn.onclick = () => openArchiveMenu(false);
            content.appendChild(backBtn);

            // Penanda awal hari 00:00
            const startBadge = document.createElement('div');
            startBadge.className = 'flex justify-center my-2';
            startBadge.innerHTML = `<span class="text-[10px] bg-white/80 text-[#8c666d] border border-[#ecc4cd] px-3 py-1 rounded-full font-semibold">🕰️ Awal Percakapan • 00:00</span>`;
            content.appendChild(startBadge);

            // Urutkan kronologis dari jam 00:00 pagi hingga malam
            const sortedMessages = [...messages].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            const chatWrapper = document.createElement('div');
            chatWrapper.className = 'space-y-3 pb-4';
            content.appendChild(chatWrapper);

            for (const msg of sortedMessages) {
                try {
                    await appendMessageToUI(msg, chatWrapper, true);
                } catch (e) {
                    console.error("Gagal render arsip pesan:", e);
                }
            }
        }

        function closeArchiveModal() {
            document.getElementById('archive-modal').classList.add('hidden');
        }

        // ================= MODAL GAMBAR & HELPERS =================
        function openImageModal(url) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = url;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function handleMessageKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
