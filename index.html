<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS Style Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            overscroll-behavior: none;
            width: 100%;
            height: 100%;
            /* Menggunakan 100dvh untuk menangani browser bar iOS Safari */
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Glassmorphism Styles */
        .ios-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
        }
        .ios-glass-header {
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            
            /* Menyesuaikan Safe Area Atas (Notch / Dynamic Island) */
            padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
        }
        .ios-glass-footer {
            /* Menyesuaikan Safe Area Bawah (Home Indicator iOS) */
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
        }
        .ios-glass-modal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black h-[100dvh] w-full flex justify-center items-center">

    <div id="app" class="w-full h-[100dvh] sm:h-[90vh] sm:max-w-md sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden relative bg-[#efeae2]">
        
        <!-- ALERT MODAL -->
        <div id="toast-modal" class="hidden absolute top-12 left-1/2 -translate-x-1/2 z-50 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg backdrop-blur-md transition-all">
            <span id="toast-message"></span>
        </div>

        <!-- HALAMAN LOGIN -->
        <div id="password-section" class="absolute inset-0 ios-glass-modal z-50 p-6 flex flex-col justify-center items-center space-y-4">
            <h2 class="text-xl font-semibold text-gray-800">Good Morning</h2>
            
            <input type="password" id="app-password" placeholder="Masukkan password..." class="w-full bg-white/70 border border-gray-300/60 p-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-inner" onkeypress="handleLoginKey(event)">

            <button onclick="verifyLogin()" class="w-full bg-blue-600 text-white p-3 rounded-2xl font-medium shadow-md hover:bg-blue-700 active:scale-95 transition">Log In</button>
            <p id="password-error" class="text-red-500 text-xs text-center"></p>
        </div>

        <!-- HEADER ALA iOS -->
        <div class="ios-glass-header px-4 pb-3 flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-500 to-indigo-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow">💬</div>
                <div>
                    <h1 id="header-title" class="font-bold text-sm text-gray-800">Chat</h1>
                    <span class="text-[10px] text-emerald-600 font-medium">● Online</span>
                </div>
            </div>
            <button onclick="logout()" class="text-xs bg-gray-200/80 px-3 py-1.5 rounded-full text-gray-700 font-medium active:scale-95 transition">Keluar</button>
        </div>

        <!-- KOTAK PESAN -->
        <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-2 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:16px_16px]">
        </div>

        <!-- MODAL GAMBAR -->
        <div id="image-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeImageModal()">
            <img id="modal-img" class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain">
        </div>

        <!-- PANEL INPUT CHATBOX -->
        <div class="ios-glass ios-glass-footer p-3 flex items-center space-x-2 z-10 shrink-0">
            <label class="cursor-pointer text-gray-500 hover:text-blue-600 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 00-2 2z" />
                </svg>
                <input type="file" id="image-input" accept="image/png, image/jpeg, image/webp, image/gif" class="hidden" onchange="handleImageSelect(event)">
            </label>

            <input type="text" id="message-input" placeholder="Pesan..." class="flex-1 bg-white/70 border border-gray-300/50 px-4 py-2 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-inner" onkeypress="handleMessageKey(event)">
            
            <button onclick="sendMessage()" class="bg-blue-600 text-white w-9 h-9 rounded-full flex items-center justify-center shadow hover:bg-blue-700 transition active:scale-95 shrink-0">
                <svg viewBox="0 0 24 24" width="16" height="16" class="fill-current"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://awlxjzfadktcthbumxle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LnE9IH5KKDzdV-gj9tIb6w_uOGVZi4o';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const FIXED_ROOM_ID = "00000000-0000-0000-0000-000000000001";
        let currentSender = "";
        let messageSubscription = null;
        let inactivityTimer = null;
        let absoluteSessionTimer = null;

        function showToast(msg) {
            const toast = document.getElementById('toast-modal');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                if (sessionStorage.getItem("chat_auth") === "true") {
                    showToast("Sesi berakhir karena 1 menit tidak ada aktivitas.");
                    setTimeout(logout, 1200);
                }
            }, 60 * 1000); // 1 menit
        }

        function startAbsoluteSessionTimer() {
            clearTimeout(absoluteSessionTimer);
            absoluteSessionTimer = setTimeout(() => {
                if (sessionStorage.getItem("chat_auth") === "true") {
                    showToast("Batas waktu 5 menit tercapai. Silakan login kembali.");
                    setTimeout(logout, 1200);
                }
            }, 5 * 60 * 1000); // 5 menit
        }

        ['mousemove', 'keydown', 'touchstart', 'click'].forEach(evt => {
            window.addEventListener(evt, resetInactivityTimer);
        });

        window.onload = function() {
            if (sessionStorage.getItem("chat_auth") === "true") {
                currentSender = sessionStorage.getItem("chat_sender");
                openChatApp();
            } else {
                sessionStorage.clear();
            }
        };

        function verifyLogin() {
            const pwd = document.getElementById('app-password').value.trim().toLowerCase();

            if (pwd !== "alifasayang" && pwd !== "wildanganteng") {
                document.getElementById('password-error').innerText = "Password salah!";
                return;
            }

            currentSender = pwd;
            sessionStorage.setItem("chat_auth", "true");
            sessionStorage.setItem("chat_sender", currentSender);
            openChatApp();
        }

        function handleLoginKey(e) {
            if (e.key === 'Enter') verifyLogin();
        }

        function logout() {
            sessionStorage.removeItem("chat_auth");
            sessionStorage.removeItem("chat_sender");
            sessionStorage.clear();
            location.reload();
        }

        async function openChatApp() {
            document.getElementById('password-section').classList.add('hidden');
            document.getElementById('header-title').innerText = `Masuk sebagai: ${currentSender}`;
            
            await ensureRoomExists();
            loadMessages();
            subscribeToRealtime();
            resetInactivityTimer();
            startAbsoluteSessionTimer();
        }

        async function ensureRoomExists() {
            let { data } = await supabaseClient.from('conversations').select('id').eq('id', FIXED_ROOM_ID).single();
            if (!data) {
                await supabaseClient.from('conversations').insert({ id: FIXED_ROOM_ID, user1: 'alifasayang', user2: 'wildanganteng' });
            }
        }

        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('conversation_id', FIXED_ROOM_ID)
                .order('created_at', { ascending: true });

            if (error) return console.error(error);

            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            for (const msg of data) {
                await appendMessageToUI(msg);
            }
            container.scrollTop = container.scrollHeight;
        }

        async function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop();
            const fileName = `${Math.random().toString(36).substring(2)}.${fileExt}`;
            const imagePath = `${FIXED_ROOM_ID}/${currentSender}/${fileName}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('chat-images')
                .upload(imagePath, file);

            if (uploadError) {
                showToast('Gagal mengunggah gambar: ' + uploadError.message);
                return;
            }

            await supabaseClient.from('messages').insert({
                conversation_id: FIXED_ROOM_ID,
                sender_name: currentSender,
                image_path: imagePath
            });

            e.target.value = '';
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();

            if (!content) return;

            const { error } = await supabaseClient
                .from('messages')
                .insert({
                    conversation_id: FIXED_ROOM_ID,
                    sender_name: currentSender, 
                    content: content
                });

            if (error) {
                showToast('Gagal mengirim: ' + error.message);
            } else {
                input.value = '';
            }
        }

        function subscribeToRealtime() {
            if (messageSubscription) supabaseClient.removeChannel(messageSubscription);

            messageSubscription = supabaseClient
                .channel('public:messages')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `conversation_id=eq.${FIXED_ROOM_ID}`
                }, async payload => {
                    await appendMessageToUI(payload.new);
                    const container = document.getElementById('messages-container');
                    container.scrollTop = container.scrollHeight;
                })
                .subscribe();
        }

        async function appendMessageToUI(msg) {
            const container = document.getElementById('messages-container');
            
            const isLeft = (msg.sender_name.toLowerCase() !== currentSender.toLowerCase());

            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full mb-1.5 ${isLeft ? 'justify-start' : 'justify-end'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] px-3.5 py-2 rounded-2xl text-sm shadow-sm relative text-gray-800 ${
                isLeft ? 'bg-white rounded-tl-sm' : 'bg-[#d9fdd3] rounded-tr-sm'
            }`;

            let imageHtml = '';
            if (msg.image_path) {
                const { data } = await supabaseClient.storage
                    .from('chat-images')
                    .createSignedUrl(msg.image_path, 3600);
                if (data) {
                    imageHtml = `<img src="${data.signedUrl}" class="rounded-xl mb-1 max-h-60 object-cover shadow cursor-pointer hover:opacity-95 transition" onclick="openImageModal('${data.signedUrl}')">`;
                }
            }

            const timeStr = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            bubble.innerHTML = `
                ${imageHtml}
                ${msg.content ? `<p class="break-words pr-10 leading-relaxed">${escapeHtml(msg.content)}</p>` : ''}
                <span class="text-[9px] text-gray-400 float-right ml-2 mt-1 select-none">${timeStr}</span>
            `;

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
        }

        function openImageModal(url) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = url;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
        }

        function handleMessageKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
