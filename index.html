<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Style Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center">

    <!-- KONTAINER UTAMA (Format Mobile / WhatsApp Web style) -->
    <div id="app" class="max-w-md mx-auto w-full bg-[#efeae2] h-full sm:h-[90vh] sm:rounded-xl flex flex-col shadow-lg overflow-hidden relative">
        
        <!-- HALAMAN PASSWORD (LOGIN SCREEN) -->
        <div id="password-section" class="absolute inset-0 bg-white z-50 p-6 flex flex-col justify-center items-center space-y-4">
            <div class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow">💬</div>
            <h2 class="text-xl font-semibold text-gray-800">Ruang Chat Privat</h2>
            <p class="text-xs text-gray-500 text-center">Masukkan password untuk mulai mengobrol.</p>
            <input type="password" id="app-password" placeholder="Password..." class="w-full border p-3 rounded-lg focus:outline-emerald-500" onkeypress="handlePasswordKey(event)">
            <button onclick="verifyPassword()" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-medium hover:bg-emerald-700 transition">Masuk</button>
            <p id="password-error" class="text-red-500 text-sm text-center"></p>
        </div>

        <!-- HEADER WHATSAPP -->
        <div class="bg-[#00a884] text-white px-4 py-3 flex justify-between items-center shadow">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-emerald-700 rounded-full flex items-center justify-center font-bold">💬</div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Ruang Obrolan</h1>
                    <span id="active-room-info" class="text-xs text-emerald-100">Menghubungkan...</span>
                </div>
            </div>
            <button onclick="lockApp()" class="text-xs bg-emerald-700 px-2 py-1 rounded hover:bg-emerald-800 transition">Kunci</button>
        </div>

        <!-- KOTAK PESAN (BACKGROUND CHAT WHATSAPP) -->
        <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-2 bg-[radial-gradient(#e5ddd5_1px,transparent_1px)] [background-size:16px_16px]">
            <!-- Pesan akan masuk di sini secara otomatis -->
        </div>

        <!-- PANEL INPUT CHAT (BAWAH) -->
        <div class="bg-[#f0f2f5] p-3 flex items-center space-x-2 border-t border-gray-200">
            <!-- Pilihan Posisi Bubble (Kiri / Kanan) -->
            <select id="bubble-side" class="bg-white border text-xs rounded-lg p-2 text-gray-700 focus:outline-emerald-500 font-medium">
                <option value="right">Kanan</option>
                <option value="left">Kiri</option>
            </select>

            <!-- Input Pesan -->
            <input type="text" id="message-input" placeholder="Ketik pesan..." class="flex-1 bg-white border-none p-2.5 rounded-lg text-sm focus:outline-none shadow-sm" onkeypress="handleMessageKey(event)">
            
            <!-- Tombol Kirim -->
            <button onclick="sendMessage()" class="bg-[#00a884] text-white p-2.5 rounded-lg hover:bg-[#01755f] transition flex items-center justify-center">
                <svg viewBox="0 0 24 24" width="20" height="20" class="fill-current"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>

    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const SUPABASE_URL = 'https://awlxjzfadktcthbumxle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LnE9IH5KKDzdV-gj9tIb6w_uOGVZi4o';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const CORRECT_PASSWORD = "alifasayang";

        // Menggunakan satu ruang chat universal agar langsung terhubung
        const FIXED_ROOM_ID = "00000000-0000-0000-0000-000000000001";
        let messageSubscription = null;

        window.onload = function() {
            if (localStorage.getItem("whatsapp_auth") === "true") {
                openChatApp();
            }
        };

        function verifyPassword() {
            const pwd = document.getElementById('app-password').value;
            if (pwd === CORRECT_PASSWORD) {
                localStorage.setItem("whatsapp_auth", "true");
                openChatApp();
            } else {
                document.getElementById('password-error').innerText = "Password salah!";
            }
        }

        function handlePasswordKey(e) {
            if (e.key === 'Enter') verifyPassword();
        }

        function lockApp() {
            localStorage.removeItem("whatsapp_auth");
            location.reload();
        }

        async function openChatApp() {
            document.getElementById('password-section').classList.add('hidden');
            document.getElementById('active-room-info').innerText = "Online";
            
            await ensureRoomExists();
            loadMessages();
            subscribeToRealtime();
        }

        async function ensureRoomExists() {
            let { data } = await supabaseClient.from('conversations').select('id').eq('id', FIXED_ROOM_ID).single();
            if (!data) {
                await supabaseClient.from('conversations').insert({ id: FIXED_ROOM_ID, user1: 'chat', user2: 'room' });
            }
        }

        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('conversation_id', FIXED_ROOM_ID)
                .order('created_at', { ascending: true });

            if (error) return console.error(error);

            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            data.forEach(msg => appendMessageToUI(msg));
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const sideSelect = document.getElementById('bubble-side');
            
            const content = input.value.trim();
            const bubbleSide = sideSelect.value; // 'left' atau 'right'

            if (!content) return;

            // sender_name kita manfaatkan untuk menyimpan preferensi posisi bubble ('left' / 'right')
            const { error } = await supabaseClient
                .from('messages')
                .insert({
                    conversation_id: FIXED_ROOM_ID,
                    sender_name: bubbleSide, 
                    content: content
                });

            if (error) {
                alert('Gagal mengirim: ' + error.message);
            } else {
                input.value = '';
            }
        }

        function subscribeToRealtime() {
            if (messageSubscription) supabaseClient.removeChannel(messageSubscription);

            messageSubscription = supabaseClient
                .channel('public:messages')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `conversation_id=eq.${FIXED_ROOM_ID}`
                }, payload => {
                    appendMessageToUI(payload.new);
                    const container = document.getElementById('messages-container');
                    container.scrollTop = container.scrollHeight;
                })
                .subscribe();
        }

        function appendMessageToUI(msg) {
            const container = document.getElementById('messages-container');
            const isRight = msg.sender_name === 'right'; // Cek apakah posisi bubble kanan atau kiri

            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full mb-1 ${isRight ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            // Desain warna ala WhatsApp: Hijau muda (#d9fdd3) untuk kanan, Putih (#ffffff) untuk kiri
            bubble.className = `max-w-[75%] px-3 py-2 rounded-lg text-sm shadow-sm relative text-gray-800 ${
                isRight ? 'bg-[#d9fdd3] rounded-tr-none' : 'bg-white rounded-tl-none'
            }`;

            const timeStr = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            bubble.innerHTML = `
                <p class="break-words pr-12">${escapeHtml(msg.content)}</p>
                <span class="text-[9px] text-gray-500 float-right ml-2 mt-1 select-none">${timeStr}</span>
            `;

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
        }

        function handleMessageKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
